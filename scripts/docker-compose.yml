version: '3.8'

services:
  crypto_dw:
    image: postgres:15-alpine
    container_name: crypto_streaming_warehouse
    environment:
      POSTGRES_USER: data_engineer
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: crypto_warehouse
    ports:
      - "5432:5432"
    volumes:
      - crypto_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_engineer -d crypto_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  crypto_data:
